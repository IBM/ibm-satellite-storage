---
apiVersion: v1
kind: List
metadata:
  name: aws-ebs-csi-driver
  namespace: kube-system
  annotations:
    version: 1.55.0
    revision: 1
items:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: aws-secret
      namespace: kube-system
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    data:
      key_id: "{{{ aws-access-key }}}"
      access_key: "{{{ aws-secret-access-key }}}"
  - apiVersion: storage.k8s.io/v1
    kind: CSIDriver
    metadata:
      name: ebs.csi.aws.com
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    spec:
      attachRequired: true
      podInfoOnMount: false
      # This parameter is supported in Kubernetes 1.33+ and requires the MutableCSINodeAllocatableCount feature gate to be enabled in kubelet and kube-apiserver.
      nodeAllocatableUpdatePeriodSeconds: 10
      fsGroupPolicy: File
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: ebs-csi-controller-sa
      namespace: kube-system
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    automountServiceAccountToken: true
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: ebs-csi-node-sa
      namespace: kube-system
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    automountServiceAccountToken: true
  - kind: ClusterRole
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: ebs-external-attacher-role
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    rules:
      - apiGroups: [""]
        resources: ["persistentvolumes"]
        verbs: ["get", "list", "watch", "patch"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["csinodes"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["volumeattachments"]
        verbs: ["get", "list", "watch", "patch"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["volumeattachments/status"]
        verbs: ["patch"]
  - kind: ClusterRole
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: ebs-csi-node-role
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    rules:
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["get", "patch"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["volumeattachments"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["patch", "list", "watch"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["csinodes"]
        verbs: ["get"]
  - kind: ClusterRole
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: ebs-external-provisioner-role
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list"]
      - apiGroups: [""]
        resources: ["persistentvolumes"]
        verbs: ["get", "list", "watch", "create", "patch", "delete"]
      - apiGroups: [""]
        resources: ["persistentvolumeclaims"]
        verbs: ["get", "list", "watch", "update"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["storageclasses"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["list", "watch", "create", "update", "patch"]
      - apiGroups: ["snapshot.storage.k8s.io"]
        resources: ["volumesnapshots"]
        verbs: ["get", "list"]
      - apiGroups: ["snapshot.storage.k8s.io"]
        resources: ["volumesnapshotcontents"]
        verbs: ["get", "list"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["csinodes"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["volumeattachments"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [ "storage.k8s.io" ]
        resources: [ "volumeattributesclasses" ]
        verbs: [ "get" ]
  - kind: ClusterRole
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: ebs-external-resizer-role
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["persistentvolumes"]
        verbs: ["get", "list", "watch", "patch"]
      - apiGroups: [""]
        resources: ["persistentvolumeclaims"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["persistentvolumeclaims/status"]
        verbs: ["patch"]
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["list", "watch", "create", "update", "patch"]
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["volumeattributesclasses"]
        verbs: ["get", "list", "watch"]
  - kind: ClusterRole
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: ebs-external-snapshotter-role
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    rules:
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["list", "watch", "create", "update", "patch"]
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list"]
      - apiGroups: ["snapshot.storage.k8s.io"]
        resources: ["volumesnapshotclasses"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["snapshot.storage.k8s.io"]
        resources: ["volumesnapshotcontents"]
        verbs: ["get", "list", "watch", "update", "patch"]
      - apiGroups: ["snapshot.storage.k8s.io"]
        resources: ["volumesnapshotcontents/status"]
        verbs: ["update", "patch"]
      - apiGroups: ["groupsnapshot.storage.k8s.io"]
        resources: ["volumegroupsnapshotclasses"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["groupsnapshot.storage.k8s.io"]
        resources: ["volumegroupsnapshotcontents"]
        verbs: ["get", "list", "watch", "update", "patch"]
      - apiGroups: ["groupsnapshot.storage.k8s.io"]
        resources: ["volumegroupsnapshotcontents/status"]
        verbs: ["update", "patch"]
  - kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: ebs-csi-attacher-binding
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    subjects:
      - kind: ServiceAccount
        name: ebs-csi-controller-sa
        namespace: kube-system
    roleRef:
      kind: ClusterRole
      name: ebs-external-attacher-role
      apiGroup: rbac.authorization.k8s.io
  - kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: ebs-csi-node-getter-binding
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/instance: 1.55.0
    subjects:
      - kind: ServiceAccount
        name: ebs-csi-node-sa
        namespace: kube-system
    roleRef:
      kind: ClusterRole
      name: ebs-csi-node-role
      apiGroup: rbac.authorization.k8s.io
  - kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: ebs-csi-provisioner-binding
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    subjects:
      - kind: ServiceAccount
        name: ebs-csi-controller-sa
        namespace: kube-system
    roleRef:
      kind: ClusterRole
      name: ebs-external-provisioner-role
      apiGroup: rbac.authorization.k8s.io
  - kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: ebs-csi-resizer-binding
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    subjects:
      - kind: ServiceAccount
        name: ebs-csi-controller-sa
        namespace: kube-system
    roleRef:
      kind: ClusterRole
      name: ebs-external-resizer-role
      apiGroup: rbac.authorization.k8s.io
  - kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: ebs-csi-snapshotter-binding
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    subjects:
      - kind: ServiceAccount
        name: ebs-csi-controller-sa
        namespace: kube-system
    roleRef:
      kind: ClusterRole
      name: ebs-external-snapshotter-role
      apiGroup: rbac.authorization.k8s.io
  - kind: Role
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      namespace: kube-system
      name: ebs-csi-leases-role
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    rules:
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["get", "watch", "list", "delete", "update", "create"]
  - kind: RoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: ebs-csi-leases-rolebinding
      namespace: kube-system
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    subjects:
    - kind: ServiceAccount
      name: ebs-csi-controller-sa
      namespace: kube-system
    roleRef:
      kind: Role
      name: ebs-csi-leases-role
      apiGroup: rbac.authorization.k8s.io
  - kind: DaemonSet
    apiVersion: apps/v1
    metadata:
      name: ebs-csi-node
      namespace: kube-system
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    spec:
      revisionHistoryLimit:
      selector:
        matchLabels:
          app: ebs-csi-node
          app.kubernetes.io/name: aws-ebs-csi-driver
          app.kubernetes.io/version: 1.55.0
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: "10%"
      template:
        metadata:
          labels:
            app: ebs-csi-node
            app.kubernetes.io/name: aws-ebs-csi-driver
            app.kubernetes.io/version: 1.55.0
          annotations:
            autoUpdate: "AUTO-UPDATE-ENABLED"
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                      - fargate
                      - auto
                      - hybrid
          nodeSelector:
            kubernetes.io/os: linux
          serviceAccountName: ebs-csi-node-sa
          terminationGracePeriodSeconds: 30
          priorityClassName: system-node-critical
          tolerations:
            - operator: Exists
          hostNetwork: false        
          securityContext:
            fsGroup: 0
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          containers:
            - name: ebs-plugin
              image: public.ecr.aws/ebs-csi-driver/aws-ebs-csi-driver:v1.55.0
              imagePullPolicy: IfNotPresent
              args:
                - node
                - --endpoint=$(CSI_ENDPOINT)
                - --csi-mount-point-prefix=/var/data/kubelet/plugins/kubernetes.io/csi/ebs.csi.aws.com/
                - --logging-format=text
                - --v=2
              env:
                - name: CSI_ENDPOINT
                  value: unix:/csi/csi.sock
                - name: CSI_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              volumeMounts:
                - name: kubelet-dir
                  mountPath: /var/data/kubelet
                  mountPropagation: "Bidirectional"
                - name: plugin-dir
                  mountPath: /csi
                - name: device-dir
                  mountPath: /dev
              ports:
                - name: healthz
                  containerPort: 9808
                  protocol: TCP
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: healthz
                initialDelaySeconds: 10
                timeoutSeconds: 3
                periodSeconds: 10
                failureThreshold: 5
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: healthz
                timeoutSeconds: 3
                periodSeconds: 5
                failureThreshold: 3
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 40Mi
              securityContext:
                readOnlyRootFilesystem: true
                privileged: true
              lifecycle:
                preStop:
                  exec:
                    command: ["/bin/aws-ebs-csi-driver", "pre-stop-hook"]
              terminationMessagePolicy: FallbackToLogsOnError
            - name: node-driver-registrar
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              image: public.ecr.aws/csi-components/csi-node-driver-registrar:v2.15.0-eksbuild.4
              imagePullPolicy: IfNotPresent
              args:
                - --csi-address=$(ADDRESS)
                - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
                - --http-endpoint=0.0.0.0:9809
                - --v=2
              env:
                - name: ADDRESS
                  value: /csi/csi.sock
                - name: DRIVER_REG_SOCK_PATH
                  value: /var/data/kubelet/plugins/ebs.csi.aws.com/csi.sock
              ports:
                - name: healthz
                  containerPort: 9809
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: healthz
                initialDelaySeconds: 30
                periodSeconds: 90
                timeoutSeconds: 15
              volumeMounts:
                - name: plugin-dir
                  mountPath: /csi
                - name: registration-dir
                  mountPath: /registration
                - name: probe-dir
                  mountPath: /var/data/kubelet/plugins/ebs.csi.aws.com/
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 40Mi
              terminationMessagePolicy: FallbackToLogsOnError
            - name: liveness-probe
              image: public.ecr.aws/csi-components/livenessprobe:v2.17.0-eksbuild.4
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              args:
                - --csi-address=/csi/csi.sock
              volumeMounts:
                - name: plugin-dir
                  mountPath: /csi
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 40Mi
              terminationMessagePolicy: FallbackToLogsOnError
          volumes:
            - name: kubelet-dir
              hostPath:
                path: /var/data/kubelet
                type: Directory
            - name: plugin-dir
              hostPath:
                path: /var/data/kubelet/plugins/ebs.csi.aws.com/
                type: DirectoryOrCreate
            - name: registration-dir
              hostPath:
                path: /var/data/kubelet/plugins_registry/
                type: Directory
            - name: device-dir
              hostPath:
                path: /dev
                type: Directory
            - name: probe-dir
              emptyDir: {}
  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: ebs-csi-controller
      namespace: kube-system
      labels:
        app.kubernetes.io/name: aws-ebs-csi-driver
        app.kubernetes.io/version: 1.55.0
    spec:
      replicas: 2
      revisionHistoryLimit: 10
      strategy:
        rollingUpdate:
          maxUnavailable: 1
        type: RollingUpdate
      selector:
        matchLabels:
          app: ebs-csi-controller
          app.kubernetes.io/name: aws-ebs-csi-driver
          app.kubernetes.io/version: 1.55.0
      template:
        metadata:
          labels:
            app: ebs-csi-controller
            app.kubernetes.io/name: aws-ebs-csi-driver
            app.kubernetes.io/version: 1.55.0
          annotations:
            autoUpdate: "AUTO-UPDATE-ENABLED"
        spec:
          nodeSelector:
            kubernetes.io/os: linux
          serviceAccountName: ebs-csi-controller-sa
          priorityClassName: system-cluster-critical
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - preference:
                  matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                    - fargate
                    - auto
                    - hybrid
                weight: 1
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                    - key: app
                      operator: In
                      values:
                      - ebs-csi-controller
                  topologyKey: kubernetes.io/hostname
                weight: 100
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
            - operator: Exists
              effect: NoExecute
              tolerationSeconds: 300
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: ebs-plugin
              image: public.ecr.aws/ebs-csi-driver/aws-ebs-csi-driver:v1.55.0
              imagePullPolicy: IfNotPresent
              args:
                - controller
                - --endpoint=$(CSI_ENDPOINT)
                - --logging-format=text
                - --batching=true
                - --user-agent-extra=helm
                - --v=2
              env:
                - name: CSI_ENDPOINT
                  value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
                - name: CSI_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-secret
                      key: key_id
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-secret
                      key: access_key
                      optional: true
                - name: AWS_EC2_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      name: aws-meta
                      key: endpoint
                      optional: true
                - name: AWS_SAGEMAKER_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      name: aws-meta
                      key: sagemaker_endpoint
                      optional: true
              volumeMounts:
                - name: socket-dir
                  mountPath: /var/lib/csi/sockets/pluginproxy/
              ports:
                - name: healthz
                  containerPort: 9808
                  protocol: TCP
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: healthz
                initialDelaySeconds: 10
                timeoutSeconds: 60
                periodSeconds: 10
                failureThreshold: 10
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: healthz
                initialDelaySeconds: 10
                timeoutSeconds: 60
                periodSeconds: 10
                failureThreshold: 5
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 40Mi
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              terminationMessagePolicy: FallbackToLogsOnError
            - name: csi-provisioner
              image: public.ecr.aws/csi-components/csi-provisioner:v6.1.0-eksbuild.2
              imagePullPolicy: IfNotPresent
              args:
                - --timeout=60s
                - --csi-address=$(ADDRESS)
                - --v=2
                - --feature-gates=Topology=true
                - --extra-create-metadata
                - --leader-election=true
                - --default-fstype=ext4
                - --kube-api-qps=20
                - --kube-api-burst=100
                - --worker-threads=100
                - --retry-interval-max=30m
              env:
                - name: ADDRESS
                  value: /var/lib/csi/sockets/pluginproxy/csi.sock
                - name: ENABLE_VAC_FALLBACK
                  value: "true"
              volumeMounts:
                - name: socket-dir
                  mountPath: /var/lib/csi/sockets/pluginproxy/
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 40Mi
              terminationMessagePolicy: FallbackToLogsOnError
            - name: csi-attacher
              image: public.ecr.aws/csi-components/csi-attacher:v4.10.0-eksbuild.3
              imagePullPolicy: IfNotPresent
              args:
                - --timeout=6m
                - --csi-address=$(ADDRESS)
                - --v=2
                - --leader-election=true
                - --kube-api-qps=20
                - --kube-api-burst=100
                - --worker-threads=100
                - --retry-interval-max=5m
              env:
                - name: ADDRESS
                  value: /var/lib/csi/sockets/pluginproxy/csi.sock
              volumeMounts:
                - name: socket-dir
                  mountPath: /var/lib/csi/sockets/pluginproxy/
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 40Mi
              terminationMessagePolicy: FallbackToLogsOnError
            - name: csi-snapshotter
              image: public.ecr.aws/csi-components/csi-snapshotter:v8.4.0-eksbuild.3
              imagePullPolicy: IfNotPresent
              args:
                - --csi-address=$(ADDRESS)
                - --leader-election=true
                - --v=2
                - --extra-create-metadata
                - --kube-api-qps=20
                - --kube-api-burst=100
                - --worker-threads=100
                - --retry-interval-max=30m
              env:
                - name: ADDRESS
                  value: /var/lib/csi/sockets/pluginproxy/csi.sock
              volumeMounts:
                - name: socket-dir
                  mountPath: /var/lib/csi/sockets/pluginproxy/
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 40Mi
              terminationMessagePolicy: FallbackToLogsOnError
            - name: csi-resizer
              image: public.ecr.aws/csi-components/csi-resizer:v2.0.0-eksbuild.3
              imagePullPolicy: IfNotPresent
              args:
                - --timeout=60s
                - --extra-modify-metadata
                - --csi-address=$(ADDRESS)
                - --v=2
                - --handle-volume-inuse-error=false
                - --leader-election=true
                - --kube-api-qps=20
                - --kube-api-burst=100
                - --workers=100
                - --retry-interval-max=30m
              env:
                - name: ADDRESS
                  value: /var/lib/csi/sockets/pluginproxy/csi.sock
                - name: ENABLE_VAC_FALLBACK
                  value: "true"
              volumeMounts:
                - name: socket-dir
                  mountPath: /var/lib/csi/sockets/pluginproxy/
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true 
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 40Mi
              terminationMessagePolicy: FallbackToLogsOnError
            - name: liveness-probe
              image: public.ecr.aws/csi-components/livenessprobe:v2.17.0-eksbuild.3
              imagePullPolicy: IfNotPresent
              args:
                - --csi-address=/csi/csi.sock
                - --probe-timeout=60s
              volumeMounts:
                - name: socket-dir
                  mountPath: /csi
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 40Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              terminationMessagePolicy: FallbackToLogsOnError
